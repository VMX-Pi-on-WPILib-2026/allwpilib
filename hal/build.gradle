ext {
    // Directory holding the VMX-pi platform library: include/*.h and lib/libvmxpi_hal_cpp.so (aarch64)
    vmxpiHalDir = file(project.findProperty('vmxpiHalDir') ?: "${rootDir}/vmxpi-hal")

    addHalDependency = { binary, shared->
        binary.lib project: ':hal', library: 'hal', linkage: shared
    }

    addHalJniDependency = { binary->
        binary.lib project: ':hal', library: 'halJNIShared', linkage: 'shared'
    }

    nativeName = 'hal'
    setBaseName = 'wpiHal'
    devMain = 'edu.wpi.first.hal.DevMain'
    niLibraries = true
    generatedHeaders = "src/generated/main/native/include"
    splitSetup = {
        if (it.targetPlatform.name == nativeUtils.wpi.platforms.roborio) {
            it.sources {
                athenaCpp(CppSourceSet) {
                    source {
                        srcDirs = ['src/main/native/athena']
                        include '**/*.cpp'
                    }
                    exportedHeaders {
                        srcDir 'src/main/native/include'
                        srcDir generatedHeaders
                    }
                }
            }
        } else if (it.targetPlatform.name == nativeUtils.wpi.platforms.linuxarm64) {
            // VMX-pi: the mau backend talks to the VMX-pi through libvmxpi_hal_cpp
            it.sources {
                mauCpp(CppSourceSet) {
                    source {
                        srcDirs = ['src/main/native/mau']
                        include '*.cpp', 'rev/*.cpp', 'Translator/*.cpp', 'DriveStation/*.cpp', 'navX/src/*.cpp'
                    }
                    exportedHeaders {
                        srcDir 'src/main/native/include'
                        srcDir generatedHeaders
                        srcDir 'src/main/native/mau'
                        srcDir 'src/main/native/mau/DriveStation/include'
                        srcDir 'src/main/native/mau/navX/include'
                        srcDir "${vmxpiHalDir}/include"
                    }
                }
            }
        } else {
            it.sources {
                simCpp(CppSourceSet) {
                    source {
                        srcDirs 'src/main/native/sim'
                        include '**/*.cpp'
                    }
                    exportedHeaders {
                        srcDir 'src/main/native/include'
                        srcDir generatedHeaders
                    }
                }
            }
        }
    }
    exeSplitSetup = {
        if (it.targetPlatform.name == nativeUtils.wpi.platforms.roborio) {
            nativeUtils.useRequiredLibrary(it, 'ni_link_libraries', 'ni_runtime_libraries')
        }
    }
}

apply from: "${rootDir}/shared/jni/setupBuild.gradle"

sourceSets.main.java.srcDir "${projectDir}/src/generated/main/java"

cppSourcesZip {
    from('src/main/native/athena') {
        into '/athena'
    }

    from('src/main/native/sim') {
        into '/sim'
    }

    from('src/main/native/mau') {
        into '/mau'
    }
}

cppHeadersZip {
    from(generatedHeaders) {
        into '/'
    }
}

Action<List<String>> symbolFilter = { symbols ->
    symbols.removeIf({ !it.startsWith('HAL_') && !it.startsWith('HALSIM_') })
} as Action<List<String>>;

nativeUtils.exportsConfigs {
    hal {
    }
    halJNI {
        x64SymbolFilter = symbolFilter
    }
}

model {
    binaries {
        all {
            if (!(it instanceof NativeBinarySpec)) return
                if (it.component.name != 'hal' && it.component.name != 'halBase') return
                if (it.targetPlatform.name == nativeUtils.wpi.platforms.linuxarm64) {
                    def vmxLib = file("${vmxpiHalDir}/lib/libvmxpi_hal_cpp.so")
                    if (vmxLib.exists() && !(it instanceof StaticLibraryBinarySpec)) {
                        it.linker.args << vmxLib.absolutePath
                    }
                    return
                }
                if (it.targetPlatform.name != nativeUtils.wpi.platforms.roborio) return
                nativeUtils.useRequiredLibrary(it, 'ni_link_libraries')
        }
    }
}
